name: sync-projects

on:
  schedule:
    - cron: '17 3 * * 1'   # weekly: Monday 03:17 UTC
  workflow_dispatch: {}    # manual: "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_projects.py
      - name: Commit and push projects.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git diff --cached --quiet && echo "No changes - projects.json is current" || {
            git commit -m "chore: sync projects.json from GitHub API"
            git push
          }
